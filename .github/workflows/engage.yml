name: Grow channel
# Hourly: refresh Instagram + YouTube stats (feeds the learning loop) and reply to genuine comments in Hindi
# (max 12 replies per run). Official APIs only - no likes, follows or fake engagement.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: video-engage
  cancel-in-progress: false
jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install requests jsonschema
      - run: python src/growth.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_COMMANDS: ${{ vars.TELEGRAM_COMMANDS || 'true' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Kolkata' }}
          START_DATE: ${{ vars.START_DATE || '2026-11-15' }}
          REVIEW_DAYS: ${{ vars.REVIEW_DAYS || '30' }}
          IG_TOKEN_SET: ${{ vars.IG_TOKEN_SET }}
          YT_POST_TIMES: ${{ vars.YT_POST_TIMES || '08:00,19:30' }}
          MAX_REPLIES_PER_RUN: ${{ vars.MAX_REPLIES_PER_RUN || '12' }}
          AUTO_REPLY: ${{ vars.AUTO_REPLY || 'true' }}
          PYTHONPATH: src
