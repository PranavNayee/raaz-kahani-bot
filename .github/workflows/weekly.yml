name: Weekly report
# Sunday 20:53 IST: Telegram report - best/worst video, both platforms' numbers, follower growth and which
# themes / hook types to make more of. Also makes a heartbeat commit so GitHub never pauses the schedules.
on:
  schedule:
    - cron: "23 15 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "Send the report even if this week's was already sent"
        type: boolean
        default: false
permissions:
  contents: write         # for the heartbeat commit below
concurrency:
  group: video-weekly
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install requests
      - run: python src/weekly.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_COMMANDS: ${{ vars.TELEGRAM_COMMANDS || 'true' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Kolkata' }}
          FORCE_REPORT: ${{ inputs.force || 'false' }}
          PYTHONPATH: src
      - name: Heartbeat commit (GitHub pauses schedules after 60 days without commits)
        if: always()
        run: |
          date -u +"%Y-%m-%dT%H:%MZ" > .github/heartbeat
          git config user.name "raaz-kahani-bot"
          git config user.email "raaz-kahani-bot@users.noreply.github.com"
          git add .github/heartbeat
          git commit -m "heartbeat: keep scheduled workflows active [skip ci]" || exit 0
          git push
