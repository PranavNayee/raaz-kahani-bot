name: Post queued video
# Light job (no rendering): publishes the queued video at its slot time. Runs every 20 min because GitHub skips
# many scheduled runs; a run that starts within 5.5 h of the slot sleeps and posts exactly on time.
# Never posts twice: a storage lock + per-platform progress + a check of each account's latest posts.
on:
  schedule:
    - cron: "4,24,44 * * * *"
  workflow_dispatch:
    inputs:
      force_post:
        description: "Post the queued video NOW (ignores the slot time, approval and retry limit)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: video-post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install requests
      - run: python src/post_pending.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_COMMANDS: ${{ vars.TELEGRAM_COMMANDS || 'true' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          POST_TIMES: ${{ vars.POST_TIMES || '19:00' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Kolkata' }}
          REVIEW_MODE: ${{ vars.REVIEW_MODE || 'auto_unless_skip' }}
          REVIEW_HOURS: ${{ vars.REVIEW_HOURS || '2' }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
          FORCE_POST: ${{ inputs.force_post || 'false' }}
          PYTHONPATH: src
