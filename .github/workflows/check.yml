name: Pre-flight check
# On every push: the offline acceptance test (renders a full sample video with no API keys).
# Manual run: also checks every service and token with your real secrets (report goes to Telegram).
on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "assets/**", "requirements.txt", ".github/**"]
  workflow_dispatch:
jobs:
  offline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/media
          key: media-v1
      - name: Install ffmpeg + text shaping
        timeout-minutes: 12
        run: bash .github/setup-media.sh
      - run: pip install -r requirements.txt
      - run: python -c "from PIL import features; assert features.check('raqm'), 'Pillow has no raqm'; print('raqm OK')"
      - run: python tests/offline_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sample-video
          path: |
            test_work/video.mp4
            test_work/cover.jpg
            test_work/caption.txt
            test_work/yt_meta.json
            test_work/story.json
          if-no-files-found: ignore
  services:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/media
          key: media-v1
      - name: Install ffmpeg + text shaping
        timeout-minutes: 12
        run: bash .github/setup-media.sh
      - run: pip install -r requirements.txt
      - run: python src/check.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_TOKEN_SET: ${{ vars.IG_TOKEN_SET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          POST_TIMES: ${{ vars.POST_TIMES || '19:00' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Kolkata' }}
          REVIEW_MODE: ${{ vars.REVIEW_MODE || 'auto_unless_skip' }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
          PYTHONPATH: src
