name: Make videos
# Production every 2 hours: makes the video for the earliest YouTube / Instagram slot that still needs one (up to
# 8 h ahead), queues it and sends the preview with approval buttons to Telegram. Runs with nothing to do exit fast.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      post_now:
        description: "Make a video and post it RIGHT NOW"
        type: boolean
        default: false
      dry_run:
        description: "Render + send to Telegram only (nothing queued or posted). Files attached as an artifact."
        type: boolean
        default: false
      force_new:
        description: "Re-make the next queued video"
        type: boolean
        default: false
      theme:
        description: "Story theme (auto = rotation / experiment engine)"
        type: choice
        options: [auto, night_mystery, magic_rule, cursed_object, greedy_rich, family_love, friendly_monster, village_legend]
        default: auto
      platform:
        description: "Which platform to make/post for"
        type: choice
        options: [both, yt, ig]
        default: both
permissions:
  contents: read
  actions: write          # keeps the schedules enabled (GitHub disables them after 60 idle days)
concurrency:
  group: video-generate
  cancel-in-progress: false
jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_TOKEN_SET: ${{ vars.IG_TOKEN_SET }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Kolkata' }}
      START_DATE: ${{ vars.START_DATE || '2026-11-15' }}
      REVIEW_MODE: ${{ vars.REVIEW_MODE || 'phase' }}
      REVIEW_DAYS: ${{ vars.REVIEW_DAYS || '30' }}
      APPROVAL_TIMEOUT: ${{ vars.APPROVAL_TIMEOUT || 'true' }}
      TELEGRAM_COMMANDS: ${{ vars.TELEGRAM_COMMANDS || 'true' }}
      YT_POST_TIMES: ${{ vars.YT_POST_TIMES || '08:00,19:30' }}
      IG_POST_TIMES: ${{ vars.IG_POST_TIMES || '20:30' }}
      LONGFORM_SLOT: ${{ vars.LONGFORM_SLOT || 'sun 11:00' }}
      DIRECTOR_TIME: ${{ vars.DIRECTOR_TIME || '10:00' }}
      YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
      SERIES_EVERY: ${{ vars.SERIES_EVERY || '3' }}
      TTS_PROVIDER: ${{ vars.TTS_PROVIDER || 'auto' }}
      GEMINI_VOICE: ${{ vars.GEMINI_VOICE || 'Charon' }}
      GEMINI_VOICE_FEMALE: ${{ vars.GEMINI_VOICE_FEMALE || 'Kore' }}
      VOICE_SPEED: ${{ vars.VOICE_SPEED || '1.1' }}
      ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
      IMAGE_PROVIDERS: ${{ vars.IMAGE_PROVIDERS || 'gemini,pollinations' }}
      REQUIRE_RAQM: "true"
      POST_NOW: ${{ inputs.post_now || 'false' }}
      STRICT_VOICE: ${{ inputs.post_now || 'false' }}    # manual post-now: never the robotic voice
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      FORCE_NEW: ${{ inputs.force_new || 'false' }}
      THEME: ${{ inputs.theme || 'auto' }}
      PLATFORM: ${{ inputs.platform || 'both' }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/media
          key: media-v1
      - name: Install ffmpeg + text shaping
        timeout-minutes: 12
        run: bash .github/setup-media.sh
      - run: pip install -r requirements.txt
      - name: Keep schedules alive
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        run: for w in daily post director engage weekly longform; do gh workflow enable $w.yml; done
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python src/main.py
      - name: Save dry-run files
        if: ${{ always() && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run
          path: |
            work/story.json
            work/video.mp4
            work/cover.jpg
            work/caption.txt
            work/yt_meta.json
          if-no-files-found: ignore
